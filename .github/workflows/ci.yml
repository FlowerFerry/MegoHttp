  # ---------------------------------------------------------------------------
  # Remaining axis coverage: the MSVC all-feature build, C++20/coroutines, uvw,
  # the full backend x TLS x string matrix, and a sanitizer run.
  #
  # Job-name convention (used everywhere in this file):
  #   <platform> <toolchain> | <backend> + <tls> + <string> | <features> | <scope>
  # so the enabled combination is readable without opening the file.
  # ---------------------------------------------------------------------------

  windows-full:
    name: Windows MSVC x64 | libuv + mbedtls + std | all features | build + full test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      # `megohttp` links the COMPILED fmt library (deps/fmt-*/build_msvc/Release/fmt.lib),
      # not just its headers; a header-only checkout leaves configure failing with
      # "fmt is required but was not found". Build it into the layout CMake reads.
      - name: Build pinned fmt into the deps layout CMake expects
        shell: bash
        run: |
          cmake -S deps/fmt-12.1.0 -B deps/fmt-12.1.0/build_msvc \
            -G "Visual Studio 17 2022" -A x64 \
            -DFMT_TEST=OFF -DFMT_DOC=OFF -DFMT_INSTALL=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/fmt-12.1.0/build_msvc"
          cmake --build deps/fmt-12.1.0/build_msvc --config Release -j 4

      - name: Checkout libuv 1.53.0
        uses: actions/checkout@v4
        with:
          repository: libuv/libuv
          ref: v1.53.0
          path: deps/libuv-1.53.0
          fetch-depth: 1

      - name: Checkout zlib 1.3.1
        uses: actions/checkout@v4
        with:
          repository: madler/zlib
          ref: v1.3.1
          path: deps/zlib-1.3.1
          fetch-depth: 1

      - name: Checkout brotli 1.1.0
        uses: actions/checkout@v4
        with:
          repository: google/brotli
          ref: v1.1.0
          path: deps/brotli-1.1.0
          fetch-depth: 1

      - name: Checkout mbedTLS 3.6.7
        uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: v3.6.7
          path: deps/mbedtls-3.6.7
          fetch-depth: 1
          # mbedTLS 3.6.7 vendors its build helpers as submodules: `framework`
          # provides the `mbedtls_framework` Python package that scripts/config.py
          # imports, and the top-level CMakeLists aborts without it. A plain
          # checkout leaves deps/mbedtls-3.6.7/framework empty, which surfaces as
          # ModuleNotFoundError and then a confusing "CMakeLists.txt not found".
          submodules: recursive

      - name: Select MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build the pinned dependencies (VS generator, Release)
        shell: bash
        run: |
          set -e
          cmake -S deps/libuv-1.53.0 -B deps/libuv-1.53.0/build_msvc \
            -G "Visual Studio 17 2022" -A x64 -DLIBUV_BUILD_SHARED=OFF
          cmake --build deps/libuv-1.53.0/build_msvc --config Release -j 4
          cmake -S deps/zlib-1.3.1 -B deps/zlib-1.3.1/build_msvc \
            -G "Visual Studio 17 2022" -A x64
          cmake --build deps/zlib-1.3.1/build_msvc --config Release -j 4
          cmake -S deps/brotli-1.1.0 -B deps/brotli-1.1.0/build_msvc \
            -G "Visual Studio 17 2022" -A x64 -DBROTLI_DISABLE_TESTS=ON
          cmake --build deps/brotli-1.1.0/build_msvc --config Release -j 4
          cmake -S deps/mbedtls-3.6.7 -B deps/mbedtls-3.6.7/build_msvc \
            -G "Visual Studio 17 2022" -A x64 \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF
          cmake --build deps/mbedtls-3.6.7/build_msvc --config Release -j 4
          ls deps/libuv-1.53.0/build_msvc/Release/libuv.lib
          ls deps/zlib-1.3.1/build_msvc/Release/zlibstatic.lib
          ls deps/brotli-1.1.0/build_msvc/Release/brotlidec.lib
          ls deps/mbedtls-3.6.7/build_msvc/library/Release/mbedtls.lib

      - name: Install Python TLS/crypto helper
        shell: bash
        run: python -m pip install --quiet cryptography

      - name: Generate TLS fixtures
        shell: bash
        run: python tests/gen_tls_fixtures.py tests/tls_fixtures

      - name: Configure and build (libuv + mbedTLS, every optional feature on)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMGHTTP_BACKEND_LIBUV=ON \
            -DMGHTTP_BACKEND_ASIO=OFF \
            -DMGHTTP_TLS_OPENSSL=OFF \
            -DMGHTTP_TLS_MBEDTLS=ON \
            -DMGHTTP_TLS_NONE=OFF \
            -DMGHTTP_USE_MEMESTRING=OFF \
            -DMGHTTP_USE_UVW=OFF \
            -DMGHTTP_ENABLE_GZIP=ON \
            -DMGHTTP_ENABLE_BROTLI=ON \
            -DMGHTTP_ENABLE_SSE=ON \
            -DMGHTTP_ENABLE_WEBSOCKET=ON \
            -DMGHTTP_ENABLE_WEBSOCKET_DEFLATE=ON \
            -DMGHTTP_ENABLE_DOT=ON \
            -DMGHTTP_ENABLE_DOH=ON \
            -DMGHTTP_BUILD_TESTS=ON \
            -DMGHTTP_BUILD_EXAMPLES=OFF
          cmake --build build -j 4

      - name: Run the whole suite
        shell: bash
        run: ctest --test-dir build --output-on-failure

