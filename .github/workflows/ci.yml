name: cross-platform

# Cross-compile-only checks do not claim runtime evidence. The task book's
# matrix distinguishes compile-only, cross-compile-only, native runtime and
# local-service integration; these jobs provide the first two categories.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-cross:
    name: Android arm64 | asio + tls-none + std | features off | cross-compile only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      - name: Checkout Asio 1.38.0 headers
        uses: actions/checkout@v4
        with:
          repository: chriskohlhoff/asio
          ref: asio-1-38-0
          path: deps/asio-asio-1-38-0
          fetch-depth: 1

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Configure and compile Android smoke target
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake -S tests/cross_compile -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/toolchains/android-ndk.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DMEGOHTTP_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build-android --verbose
          ls -l build-android/libmegohttp_cross_smoke.a

  ios-cross:
    name: iOS arm64 | asio + tls-none + std | features off | cross-compile only
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      - name: Checkout Asio 1.38.0 headers
        uses: actions/checkout@v4
        with:
          repository: chriskohlhoff/asio
          ref: asio-1-38-0
          path: deps/asio-asio-1-38-0
          fetch-depth: 1

      - name: Show toolchain versions
        run: |
          cmake --version
          xcodebuild -version

      - name: Configure and compile iOS smoke target
        run: |
          cmake -S tests/cross_compile -B build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/toolchains/ios.cmake" \
            -DMEGOHTTP_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build-ios --config Release --target megohttp_cross_smoke
          ls -l build-ios/Release-iphoneos/libmegohttp_cross_smoke.a

  macos-trust:
    name: macOS arm64 | asio + tls-none + std | features off | trust test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Asio 1.38.0 headers
        uses: actions/checkout@v4
        with:
          repository: chriskohlhoff/asio
          ref: asio-1-38-0
          path: deps/asio-asio-1-38-0
          fetch-depth: 1

      - name: Install header-only dependency
        run: brew install fmt

      - name: Build and run the trust test
        run: |
          cmake -S . -B build-macos-trust -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMGHTTP_BACKEND_LIBUV=OFF \
            -DMGHTTP_BACKEND_ASIO=ON \
            -DMGHTTP_USE_UVW=OFF \
            -DMGHTTP_TLS_NONE=ON \
            -DMGHTTP_TLS_OPENSSL=OFF \
            -DMGHTTP_TLS_MBEDTLS=OFF \
            -DMGHTTP_USE_MEMESTRING=OFF \
            -DMGHTTP_ENABLE_GZIP=OFF \
            -DMGHTTP_ENABLE_BROTLI=OFF \
            -DMGHTTP_ENABLE_SSE=OFF \
            -DMGHTTP_ENABLE_WEBSOCKET=OFF \
            -DMGHTTP_ENABLE_WEBSOCKET_DEFLATE=OFF \
            -DMGHTTP_ENABLE_DOT=OFF \
            -DMGHTTP_ENABLE_DOH=OFF \
            -DMGHTTP_BUILD_TESTS=ON \
            -DMGHTTP_BUILD_EXAMPLES=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix fmt)"
          cmake --build build-macos-trust --target test_tls_trust -j2
          ./build-macos-trust/tests/test_tls_trust

  windows-msvc:
    name: Windows MSVC ${{ matrix.arch }} | asio + tls-none + std | features off | build + full test
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      - name: Checkout Asio 1.38.0 headers
        uses: actions/checkout@v4
        with:
          repository: chriskohlhoff/asio
          ref: asio-1-38-0
          path: deps/asio-asio-1-38-0
          fetch-depth: 1

      - name: Select MSVC ${{ matrix.arch }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build pinned fmt
        shell: bash
        run: |
          cmake -S deps/fmt-12.1.0 -B fmt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF -DFMT_INSTALL=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/fmt-install"
          cmake --build fmt-build --target install -j 2

      - name: Configure MegoHttp
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/fmt-install" \
            -DMGHTTP_BACKEND_LIBUV=OFF \
            -DMGHTTP_BACKEND_ASIO=ON \
            -DMGHTTP_USE_UVW=OFF \
            -DMGHTTP_TLS_NONE=ON \
            -DMGHTTP_TLS_OPENSSL=OFF \
            -DMGHTTP_TLS_MBEDTLS=OFF \
            -DMGHTTP_USE_MEMESTRING=OFF \
            -DMGHTTP_ENABLE_GZIP=OFF \
            -DMGHTTP_ENABLE_BROTLI=OFF \
            -DMGHTTP_ENABLE_SSE=OFF \
            -DMGHTTP_ENABLE_WEBSOCKET=OFF \
            -DMGHTTP_ENABLE_WEBSOCKET_DEFLATE=OFF \
            -DMGHTTP_ENABLE_DOT=OFF \
            -DMGHTTP_ENABLE_DOH=OFF \
            -DMGHTTP_ENABLE_COROUTINES=OFF \
            -DMGHTTP_BUILD_TESTS=ON \
            -DMGHTTP_BUILD_EXAMPLES=OFF
          cmake --build build -j 2

      - name: Run tests
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure

  linux-native:
    name: Linux ${{ matrix.name }} | asio + tls-none + std | features off | build + 8-suite test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC x64
            cxx: g++
            arch: x64
            cxx_flags: ""
          - name: GCC x86
            cxx: g++
            arch: x86
            cxx_flags: "-m32"
          - name: Clang x64
            cxx: clang++
            arch: x64
            cxx_flags: ""
          - name: Clang x86
            cxx: clang++
            arch: x86
            cxx_flags: "-m32"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      - name: Checkout Asio 1.38.0 headers
        uses: actions/checkout@v4
        with:
          repository: chriskohlhoff/asio
          ref: asio-1-38-0
          path: deps/asio-asio-1-38-0
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++ clang g++-multilib

      - name: Build pinned fmt
        run: |
          cmake -S deps/fmt-12.1.0 -B fmt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.cxx_flags }}" \
            -DFMT_TEST=OFF -DFMT_DOC=OFF -DFMT_INSTALL=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_PREFIX="${PWD}/fmt-install"
          cmake --build fmt-build --target install -j 2

      - name: Configure MegoHttp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_PREFIX_PATH="${PWD}/fmt-install" \
            -DMGHTTP_BACKEND_LIBUV=OFF \
            -DMGHTTP_BACKEND_ASIO=ON \
            -DMGHTTP_USE_UVW=OFF \
            -DMGHTTP_TLS_NONE=ON \
            -DMGHTTP_TLS_OPENSSL=OFF \
            -DMGHTTP_TLS_MBEDTLS=OFF \
            -DMGHTTP_USE_MEMESTRING=OFF \
            -DMGHTTP_ENABLE_GZIP=OFF \
            -DMGHTTP_ENABLE_BROTLI=OFF \
            -DMGHTTP_ENABLE_SSE=OFF \
            -DMGHTTP_ENABLE_WEBSOCKET=OFF \
            -DMGHTTP_ENABLE_WEBSOCKET_DEFLATE=OFF \
            -DMGHTTP_ENABLE_DOT=OFF \
            -DMGHTTP_ENABLE_DOH=OFF \
            -DMGHTTP_ENABLE_COROUTINES=OFF \
            -DMGHTTP_BUILD_TESTS=ON \
            -DMGHTTP_BUILD_EXAMPLES=OFF
          cmake --build build --target \
            test_core test_http test_client test_dns_wire test_content_type \
            test_content_range test_multipart test_multipart_response -j 2

      - name: Run core tests
        run: |
          ctest --test-dir build --output-on-failure \
            -R '^(test_core|test_http|test_dns_wire|test_content_type|test_content_range|test_multipart|test_multipart_response)$'

  # ---------------------------------------------------------------------------
  # Full-feature native builds (compile coverage for every platform branch).
  #
  # The jobs above deliberately compile the portable core only. These turn on
  # everything — libuv, OpenSSL/mbedTLS, gzip/brotli, SSE, WebSocket(+deflate),
  # DoT/DoH — and compile the whole test tree as well, so the non-Windows code
  # paths are built instead of merely parsed.
  #
  # They do NOT run the suite. The Python fixtures that serve proxies, DoT/DoH
  # endpoints and two-layer TLS spawn processes through Windows APIs
  # (`tests/proxy_server_fixture.hpp` is a stub off Windows), so a full ctest
  # here would fail for harness reasons, not library reasons. Runtime coverage
  # stays with `linux-native` (portable core) until those fixtures get POSIX
  # spawn/kill support. Evidence category: compile-only.
  # ---------------------------------------------------------------------------

  linux-full-libuv:
    name: Linux GCC x64 | libuv + openssl + std | all features | build + install/consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      # `megohttp` links the COMPILED fmt library (deps/fmt-*/<dep-build>/libfmt.a),
      # not just its headers; a header-only checkout leaves configure failing with
      # "fmt is required but was not found". Build it into the layout CMake reads.
      - name: Build pinned fmt into the deps layout CMake expects
        run: |
          cmake -S deps/fmt-12.1.0 -B deps/fmt-12.1.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF -DFMT_INSTALL=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/fmt-12.1.0/build_mingw"
          cmake --build deps/fmt-12.1.0/build_mingw -j 2

      - name: Checkout libuv 1.53.0
        uses: actions/checkout@v4
        with:
          repository: libuv/libuv
          ref: v1.53.0
          path: deps/libuv-1.53.0
          fetch-depth: 1

      - name: Checkout brotli 1.1.0
        uses: actions/checkout@v4
        with:
          repository: google/brotli
          ref: v1.1.0
          path: deps/brotli-1.1.0
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++ libssl-dev zlib1g-dev

      - name: Build libuv and brotli into the layout CMake expects
        run: |
          cmake -S deps/libuv-1.53.0 -B deps/libuv-1.53.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBUV_BUILD_SHARED=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/libuv-1.53.0/build_mingw"
          cmake --build deps/libuv-1.53.0/build_mingw -j 4
          cmake -S deps/brotli-1.1.0 -B deps/brotli-1.1.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBROTLI_DISABLE_TESTS=ON \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/brotli-1.1.0/build_mingw"
          cmake --build deps/brotli-1.1.0/build_mingw -j 4
          ls -l deps/libuv-1.53.0/build_mingw/libuv*.a
          ls -l deps/brotli-1.1.0/build_mingw/libbrotli*.a

      - name: Configure and build (libuv + OpenSSL, every optional feature on)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMGHTTP_BACKEND_LIBUV=ON \
            -DMGHTTP_BACKEND_ASIO=OFF \
            -DMGHTTP_TLS_OPENSSL=ON \
            -DMGHTTP_TLS_MBEDTLS=OFF \
            -DMGHTTP_TLS_NONE=OFF \
            -DMGHTTP_USE_MEMESTRING=OFF \
            -DMGHTTP_USE_UVW=OFF \
            -DMGHTTP_ENABLE_GZIP=ON \
            -DMGHTTP_ENABLE_BROTLI=ON \
            -DMGHTTP_ENABLE_SSE=ON \
            -DMGHTTP_ENABLE_WEBSOCKET=ON \
            -DMGHTTP_ENABLE_WEBSOCKET_DEFLATE=ON \
            -DMGHTTP_ENABLE_DOT=ON \
            -DMGHTTP_ENABLE_DOH=ON \
            -DMGHTTP_BUILD_TESTS=ON \
            -DMGHTTP_BUILD_EXAMPLES=OFF
          cmake --build build -j 4

      - name: Install the package and consume it with find_package
        run: |
          cmake --install build --prefix "$PWD/install"
          cmake -S tests/consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer-build -j 4
          ./consumer-build/consumer

  linux-full-asio-mbedtls:
    name: Linux GCC x64 | asio + mbedtls + std | all features | build only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      # `megohttp` links the COMPILED fmt library (deps/fmt-*/<dep-build>/libfmt.a),
      # not just its headers; a header-only checkout leaves configure failing with
      # "fmt is required but was not found". Build it into the layout CMake reads.
      - name: Build pinned fmt into the deps layout CMake expects
        run: |
          cmake -S deps/fmt-12.1.0 -B deps/fmt-12.1.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF -DFMT_INSTALL=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/fmt-12.1.0/build_mingw"
          cmake --build deps/fmt-12.1.0/build_mingw -j 2

      - name: Checkout Asio 1.38.0 headers
        uses: actions/checkout@v4
        with:
          repository: chriskohlhoff/asio
          ref: asio-1-38-0
          path: deps/asio-asio-1-38-0
          fetch-depth: 1

      - name: Checkout mbedTLS 3.6.7
        uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: v3.6.7
          path: deps/mbedtls-3.6.7
          fetch-depth: 1
          # mbedTLS 3.6.7 vendors its build helpers as submodules: `framework`
          # provides the `mbedtls_framework` Python package that scripts/config.py
          # imports, and the top-level CMakeLists aborts without it. A plain
          # checkout leaves deps/mbedtls-3.6.7/framework empty, which surfaces as
          # ModuleNotFoundError and then a confusing "CMakeLists.txt not found".
          submodules: recursive

      - name: Checkout brotli 1.1.0
        uses: actions/checkout@v4
        with:
          repository: google/brotli
          ref: v1.1.0
          path: deps/brotli-1.1.0
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++ zlib1g-dev

      - name: Build mbedTLS and brotli into the layout CMake expects
        run: |
          cmake -S deps/mbedtls-3.6.7 -B deps/mbedtls-3.6.7/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/mbedtls-3.6.7/build_mingw/library"
          cmake --build deps/mbedtls-3.6.7/build_mingw -j 4
          cmake -S deps/brotli-1.1.0 -B deps/brotli-1.1.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBROTLI_DISABLE_TESTS=ON \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/brotli-1.1.0/build_mingw"
          cmake --build deps/brotli-1.1.0/build_mingw -j 4
          ls -l deps/mbedtls-3.6.7/build_mingw/library/libmbed*.a

      - name: Configure and build (Asio + mbedTLS, every optional feature on)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMGHTTP_BACKEND_LIBUV=OFF \
            -DMGHTTP_BACKEND_ASIO=ON \
            -DMGHTTP_TLS_OPENSSL=OFF \
            -DMGHTTP_TLS_MBEDTLS=ON \
            -DMGHTTP_TLS_NONE=OFF \
            -DMGHTTP_USE_MEMESTRING=OFF \
            -DMGHTTP_USE_UVW=OFF \
            -DMGHTTP_ENABLE_GZIP=ON \
            -DMGHTTP_ENABLE_BROTLI=ON \
            -DMGHTTP_ENABLE_SSE=ON \
            -DMGHTTP_ENABLE_WEBSOCKET=ON \
            -DMGHTTP_ENABLE_WEBSOCKET_DEFLATE=ON \
            -DMGHTTP_ENABLE_DOT=ON \
            -DMGHTTP_ENABLE_DOH=ON \
            -DMGHTTP_BUILD_TESTS=ON \
            -DMGHTTP_BUILD_EXAMPLES=OFF
          cmake --build build -j 4

  linux-full-memestring:
    name: Linux GCC x64 | libuv + openssl + memestring | all features | build only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      # `megohttp` links the COMPILED fmt library (deps/fmt-*/<dep-build>/libfmt.a),
      # not just its headers; a header-only checkout leaves configure failing with
      # "fmt is required but was not found". Build it into the layout CMake reads.
      - name: Build pinned fmt into the deps layout CMake expects
        run: |
          cmake -S deps/fmt-12.1.0 -B deps/fmt-12.1.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF -DFMT_INSTALL=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/fmt-12.1.0/build_mingw"
          cmake --build deps/fmt-12.1.0/build_mingw -j 2

      - name: Checkout libuv 1.53.0
        uses: actions/checkout@v4
        with:
          repository: libuv/libuv
          ref: v1.53.0
          path: deps/libuv-1.53.0
          fetch-depth: 1

      - name: Checkout brotli 1.1.0
        uses: actions/checkout@v4
        with:
          repository: google/brotli
          ref: v1.1.0
          path: deps/brotli-1.1.0
          fetch-depth: 1

      # MemeString has no 0.0.5 tag upstream (latest is v0.0.4-alpha), so this
      # tracks the default branch. If it drifts, pin the commit whose headers
      # match the vendored copy instead.
      - name: Checkout MemeString
        uses: actions/checkout@v4
        with:
          repository: FlowerFerry/MemeString
          path: deps/MemeString
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++ libssl-dev zlib1g-dev

      - name: Build libuv, brotli and MemeString
        run: |
          cmake -S deps/libuv-1.53.0 -B deps/libuv-1.53.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBUV_BUILD_SHARED=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/libuv-1.53.0/build_mingw"
          cmake --build deps/libuv-1.53.0/build_mingw -j 4
          cmake -S deps/brotli-1.1.0 -B deps/brotli-1.1.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBROTLI_DISABLE_TESTS=ON \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/brotli-1.1.0/build_mingw"
          cmake --build deps/brotli-1.1.0/build_mingw -j 4
          cmake -S deps/MemeString -B deps/MemeString/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build deps/MemeString/build -j 4
          find deps/MemeString/build -maxdepth 2 -name 'libmeme_string*' -print
          cp -v deps/MemeString/build/libmeme_string.so deps/MemeString/libmeme_string.so

      - name: Configure and build (libuv + OpenSSL + MemeString layer)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMGHTTP_BACKEND_LIBUV=ON \
            -DMGHTTP_BACKEND_ASIO=OFF \
            -DMGHTTP_TLS_OPENSSL=ON \
            -DMGHTTP_TLS_MBEDTLS=OFF \
            -DMGHTTP_TLS_NONE=OFF \
            -DMGHTTP_USE_MEMESTRING=ON \
            -DMEMESTRING_RUNTIME="$PWD/deps/MemeString/libmeme_string.so" \
            -DMGHTTP_USE_UVW=OFF \
            -DMGHTTP_ENABLE_GZIP=ON \
            -DMGHTTP_ENABLE_BROTLI=ON \
            -DMGHTTP_ENABLE_SSE=ON \
            -DMGHTTP_ENABLE_WEBSOCKET=ON \
            -DMGHTTP_ENABLE_WEBSOCKET_DEFLATE=ON \
            -DMGHTTP_ENABLE_DOT=ON \
            -DMGHTTP_ENABLE_DOH=ON \
            -DMGHTTP_BUILD_TESTS=ON \
            -DMGHTTP_BUILD_EXAMPLES=OFF
          cmake --build build -j 4

  macos-full:
    name: macOS arm64 | libuv + openssl + std | all features | build only
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      # `megohttp` links the COMPILED fmt library (deps/fmt-*/<dep-build>/libfmt.a),
      # not just its headers; a header-only checkout leaves configure failing with
      # "fmt is required but was not found". Build it into the layout CMake reads.
      - name: Build pinned fmt into the deps layout CMake expects
        run: |
          cmake -S deps/fmt-12.1.0 -B deps/fmt-12.1.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF -DFMT_INSTALL=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/fmt-12.1.0/build_mingw"
          cmake --build deps/fmt-12.1.0/build_mingw -j 2

      - name: Checkout libuv 1.53.0
        uses: actions/checkout@v4
        with:
          repository: libuv/libuv
          ref: v1.53.0
          path: deps/libuv-1.53.0
          fetch-depth: 1

      - name: Checkout brotli 1.1.0
        uses: actions/checkout@v4
        with:
          repository: google/brotli
          ref: v1.1.0
          path: deps/brotli-1.1.0
          fetch-depth: 1

      - name: Install toolchain
        run: brew install ninja openssl@3

      - name: Build libuv and brotli into the layout CMake expects
        run: |
          cmake -S deps/libuv-1.53.0 -B deps/libuv-1.53.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBUV_BUILD_SHARED=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/libuv-1.53.0/build_mingw"
          cmake --build deps/libuv-1.53.0/build_mingw -j 4
          cmake -S deps/brotli-1.1.0 -B deps/brotli-1.1.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBROTLI_DISABLE_TESTS=ON \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/brotli-1.1.0/build_mingw"
          cmake --build deps/brotli-1.1.0/build_mingw -j 4
          ls -l deps/libuv-1.53.0/build_mingw/libuv*.a
          ls -l deps/brotli-1.1.0/build_mingw/libbrotli*.a

      - name: Configure and build (libuv + OpenSSL, every optional feature on)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3)" \
            -DMGHTTP_BACKEND_LIBUV=ON \
            -DMGHTTP_BACKEND_ASIO=OFF \
            -DMGHTTP_TLS_OPENSSL=ON \
            -DMGHTTP_TLS_MBEDTLS=OFF \
            -DMGHTTP_TLS_NONE=OFF \
            -DMGHTTP_USE_MEMESTRING=OFF \
            -DMGHTTP_USE_UVW=OFF \
            -DMGHTTP_ENABLE_GZIP=ON \
            -DMGHTTP_ENABLE_BROTLI=ON \
            -DMGHTTP_ENABLE_SSE=ON \
            -DMGHTTP_ENABLE_WEBSOCKET=ON \
            -DMGHTTP_ENABLE_WEBSOCKET_DEFLATE=ON \
            -DMGHTTP_ENABLE_DOT=ON \
            -DMGHTTP_ENABLE_DOH=ON \
            -DMGHTTP_BUILD_TESTS=ON \
            -DMGHTTP_BUILD_EXAMPLES=OFF
