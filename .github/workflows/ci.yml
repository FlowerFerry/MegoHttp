  linux-axis-matrix:
    name: Linux GCC x64 | ${{ matrix.backend }} + ${{ matrix.tls }} + ${{ matrix.string }} | sse+ws, codecs off | build only
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: libuv, tls: none,    string: std,       dotdoh: OFF }
          - { backend: libuv, tls: none,    string: memestring, dotdoh: OFF }
          - { backend: libuv, tls: openssl, string: std,       dotdoh: ON }
          - { backend: libuv, tls: openssl, string: memestring, dotdoh: ON }
          - { backend: libuv, tls: mbedtls, string: std,       dotdoh: ON }
          - { backend: libuv, tls: mbedtls, string: memestring, dotdoh: ON }
          - { backend: asio,  tls: none,    string: std,       dotdoh: OFF }
          - { backend: asio,  tls: none,    string: memestring, dotdoh: OFF }
          - { backend: asio,  tls: openssl, string: std,       dotdoh: ON }
          - { backend: asio,  tls: openssl, string: memestring, dotdoh: ON }
          - { backend: asio,  tls: mbedtls, string: std,       dotdoh: ON }
          - { backend: asio,  tls: mbedtls, string: memestring, dotdoh: ON }
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      # `megohttp` links the COMPILED fmt library (deps/fmt-*/<dep-build>/libfmt.a),
      # not just its headers; a header-only checkout leaves configure failing with
      # "fmt is required but was not found". Build it into the layout CMake reads.
      - name: Build pinned fmt into the deps layout CMake expects
        run: |
          cmake -S deps/fmt-12.1.0 -B deps/fmt-12.1.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF -DFMT_INSTALL=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/fmt-12.1.0/build_mingw"
          cmake --build deps/fmt-12.1.0/build_mingw -j 2

      - name: Checkout Asio 1.38.0 headers
        uses: actions/checkout@v4
        with:
          repository: chriskohlhoff/asio
          ref: asio-1-38-0
          path: deps/asio-asio-1-38-0
          fetch-depth: 1

      - name: Checkout libuv 1.53.0
        if: matrix.backend == 'libuv'
        uses: actions/checkout@v4
        with:
          repository: libuv/libuv
          ref: v1.53.0
          path: deps/libuv-1.53.0
          fetch-depth: 1

      - name: Checkout mbedTLS 3.6.7
        if: matrix.tls == 'mbedtls'
        uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: v3.6.7
          path: deps/mbedtls-3.6.7
          fetch-depth: 1
          # mbedTLS 3.6.7 vendors its build helpers as submodules: `framework`
          # provides the `mbedtls_framework` Python package that scripts/config.py
          # imports, and the top-level CMakeLists aborts without it. A plain
          # checkout leaves deps/mbedtls-3.6.7/framework empty, which surfaces as
          # ModuleNotFoundError and then a confusing "CMakeLists.txt not found".
          submodules: recursive

      - name: Checkout MemeString
        if: matrix.string == 'memestring'
        uses: actions/checkout@v4
        with:
          repository: FlowerFerry/MemeString
          path: deps/MemeString
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++ libssl-dev

      - name: Build libuv
        if: matrix.backend == 'libuv'
        run: |
          cmake -S deps/libuv-1.53.0 -B deps/libuv-1.53.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBUV_BUILD_SHARED=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/libuv-1.53.0/build_mingw"
          cmake --build deps/libuv-1.53.0/build_mingw -j 4

      - name: Build mbedTLS
        if: matrix.tls == 'mbedtls'
        run: |
          cmake -S deps/mbedtls-3.6.7 -B deps/mbedtls-3.6.7/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/mbedtls-3.6.7/build_mingw/library"
          cmake --build deps/mbedtls-3.6.7/build_mingw -j 4

      - name: Build MemeString
        if: matrix.string == 'memestring'
        run: |
          cmake -S deps/MemeString -B deps/MemeString/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build deps/MemeString/build -j 4
          cp -v deps/MemeString/build/libmeme_string.so deps/MemeString/libmeme_string.so

      - name: Configure and build the axis combination
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMGHTTP_BACKEND_LIBUV=${{ matrix.backend == 'libuv' && 'ON' || 'OFF' }} \
            -DMGHTTP_BACKEND_ASIO=${{ matrix.backend == 'asio' && 'ON' || 'OFF' }} \
            -DMGHTTP_TLS_NONE=${{ matrix.tls == 'none' && 'ON' || 'OFF' }} \
            -DMGHTTP_TLS_OPENSSL=${{ matrix.tls == 'openssl' && 'ON' || 'OFF' }} \
            -DMGHTTP_TLS_MBEDTLS=${{ matrix.tls == 'mbedtls' && 'ON' || 'OFF' }} \
            -DMGHTTP_USE_MEMESTRING=${{ matrix.string == 'memestring' && 'ON' || 'OFF' }} \
            -DMEMESTRING_RUNTIME="$PWD/deps/MemeString/libmeme_string.so" \
            -DMGHTTP_USE_UVW=OFF \
            -DMGHTTP_ENABLE_GZIP=OFF \
            -DMGHTTP_ENABLE_BROTLI=OFF \
            -DMGHTTP_ENABLE_SSE=ON \
            -DMGHTTP_ENABLE_WEBSOCKET=ON \
            -DMGHTTP_ENABLE_WEBSOCKET_DEFLATE=OFF \
            -DMGHTTP_ENABLE_DOT=${{ matrix.dotdoh }} \
            -DMGHTTP_ENABLE_DOH=${{ matrix.dotdoh }} \
            -DMGHTTP_BUILD_TESTS=OFF \
            -DMGHTTP_BUILD_EXAMPLES=OFF
          cmake --build build -j 4

  linux-sanitizer:
    name: Linux Clang x64 | asio + tls-none + std | features off | asan+ubsan, 8-suite test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      # `megohttp` links the COMPILED fmt library (deps/fmt-*/<dep-build>/libfmt.a),
      # not just its headers; a header-only checkout leaves configure failing with
      # "fmt is required but was not found". Build it into the layout CMake reads.
      - name: Build pinned fmt into the deps layout CMake expects
        run: |
          cmake -S deps/fmt-12.1.0 -B deps/fmt-12.1.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF -DFMT_INSTALL=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/fmt-12.1.0/build_mingw"
          cmake --build deps/fmt-12.1.0/build_mingw -j 2

      - name: Checkout Asio 1.38.0 headers
        uses: actions/checkout@v4
        with:
          repository: chriskohlhoff/asio
          ref: asio-1-38-0
          path: deps/asio-asio-1-38-0
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang

      - name: Configure and build with ASan + UBSan
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DMGHTTP_BACKEND_LIBUV=OFF \
            -DMGHTTP_BACKEND_ASIO=ON \
            -DMGHTTP_TLS_NONE=ON \
            -DMGHTTP_TLS_OPENSSL=OFF \
            -DMGHTTP_TLS_MBEDTLS=OFF \
            -DMGHTTP_USE_MEMESTRING=OFF \
            -DMGHTTP_USE_UVW=OFF \
            -DMGHTTP_ENABLE_GZIP=OFF \
            -DMGHTTP_ENABLE_BROTLI=OFF \
            -DMGHTTP_ENABLE_SSE=OFF \
            -DMGHTTP_ENABLE_WEBSOCKET=OFF \
            -DMGHTTP_ENABLE_WEBSOCKET_DEFLATE=OFF \
            -DMGHTTP_ENABLE_DOT=OFF \
            -DMGHTTP_ENABLE_DOH=OFF \
            -DMGHTTP_BUILD_TESTS=ON \
            -DMGHTTP_BUILD_EXAMPLES=OFF
          cmake --build build -j 4

      - name: Run the portable suites under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          ctest --test-dir build --output-on-failure \
            -R '^(test_core|test_http|test_dns_wire|test_content_type|test_content_range|test_multipart|test_multipart_response|test_client)$'

  linux-examples:
    name: Linux GCC x64 | libuv + openssl + std | examples on | build + run offline examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      # `megohttp` links the COMPILED fmt library (deps/fmt-*/<dep-build>/libfmt.a),
      # not just its headers; a header-only checkout leaves configure failing with
      # "fmt is required but was not found". Build it into the layout CMake reads.
      - name: Build pinned fmt into the deps layout CMake expects
        run: |
          cmake -S deps/fmt-12.1.0 -B deps/fmt-12.1.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF -DFMT_INSTALL=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/fmt-12.1.0/build_mingw"
          cmake --build deps/fmt-12.1.0/build_mingw -j 2

      - name: Checkout libuv 1.53.0
        uses: actions/checkout@v4
        with:
          repository: libuv/libuv
          ref: v1.53.0
          path: deps/libuv-1.53.0
          fetch-depth: 1

      - name: Install toolchain and TLS fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++ libssl-dev
          python3 -m pip install --quiet cryptography

      - name: Build libuv
        run: |
          cmake -S deps/libuv-1.53.0 -B deps/libuv-1.53.0/build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBUV_BUILD_SHARED=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/deps/libuv-1.53.0/build_mingw"
          cmake --build deps/libuv-1.53.0/build_mingw -j 4

      - name: Build the examples (every feature that needs no extra dependency)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMGHTTP_BACKEND_LIBUV=ON \
            -DMGHTTP_BACKEND_ASIO=OFF \
            -DMGHTTP_TLS_OPENSSL=ON \
            -DMGHTTP_TLS_MBEDTLS=OFF \
            -DMGHTTP_TLS_NONE=OFF \
            -DMGHTTP_USE_MEMESTRING=OFF \
            -DMGHTTP_USE_UVW=OFF \
            -DMGHTTP_ENABLE_GZIP=OFF \
            -DMGHTTP_ENABLE_BROTLI=OFF \
            -DMGHTTP_ENABLE_SSE=ON \
            -DMGHTTP_ENABLE_WEBSOCKET=ON \
            -DMGHTTP_ENABLE_WEBSOCKET_DEFLATE=ON \
            -DMGHTTP_ENABLE_DOT=ON \
            -DMGHTTP_ENABLE_DOH=ON \
            -DMGHTTP_BUILD_TESTS=OFF \
            -DMGHTTP_BUILD_EXAMPLES=ON
          cmake --build build -j 4
          ls build/examples

      - name: Run the plain-HTTP examples
        run: |
          set -e
          python3 -m http.server 8080 --bind 127.0.0.1 > http.log 2>&1 &
          for i in $(seq 1 50); do
            if python3 -c "import socket;socket.create_connection(('127.0.0.1',8080),1)" 2>/dev/null; then break; fi
            sleep 0.2
          done
          ./build/examples/megohttp_example_sync_get http://127.0.0.1:8080/README.md
          ./build/examples/megohttp_example_future_get http://127.0.0.1:8080/README.md
          ./build/examples/megohttp_example_stream_download http://127.0.0.1:8080/README.md out.bin
          cmp README.md out.bin
          ./build/examples/megohttp_example_external_libuv_loop http://127.0.0.1:8080/README.md

      - name: Run the SSE example against the bundled server
        run: |
          set -e
          python3 examples/servers/sse_server.py 8081 > sse.log 2>&1 &
          for i in $(seq 1 50); do
            if python3 -c "import socket;socket.create_connection(('127.0.0.1',8081),1)" 2>/dev/null; then break; fi
            sleep 0.2
          done
          ./build/examples/megohttp_example_sse_client http://127.0.0.1:8081/events 3

      - name: Run the WebSocket example against the bundled echo server
        run: |
          set -e
          python3 examples/servers/ws_echo_server.py 8082 > ws.log 2>&1 &
          for i in $(seq 1 50); do
            if python3 -c "import socket;socket.create_connection(('127.0.0.1',8082),1)" 2>/dev/null; then break; fi
            sleep 0.2
          done
          ./build/examples/megohttp_example_websocket_echo ws://127.0.0.1:8082/chat

      - name: Run the encrypted-DNS examples against the TLS fixtures
        run: |
          set -e
          python3 tests/gen_tls_fixtures.py tests/tls_fixtures
          python3 tests/dot_test_server.py --cert tests/tls_fixtures/server-cert.pem \
            --key tests/tls_fixtures/server-key.pem > dot.log 2>&1 &
          python3 tests/doh_test_server.py --cert tests/tls_fixtures/server-cert.pem \
            --key tests/tls_fixtures/server-key.pem > doh.log 2>&1 &
          for i in $(seq 1 50); do
            grep -q READY dot.log && grep -q READY doh.log && break
            sleep 0.2
          done
          DOT_PORT=$(awk '/READY/{print $3}' dot.log)
          DOH_PORT=$(awk '/READY/{print $3}' doh.log)
          echo "DoT port $DOT_PORT, DoH port $DOH_PORT"
          ./build/examples/megohttp_example_dot_resolve --port "$DOT_PORT" example.com
          ./build/examples/megohttp_example_doh_resolve --port "$DOH_PORT" dual.example
          ./build/examples/megohttp_example_encrypted_dns_strict_bootstrap --port "$DOT_PORT"

      - name: Run the cancellation example against the slow server
        run: |
          set -e
          python3 examples/servers/slow_server.py 8084 500 > slow.log 2>&1 &
          for i in $(seq 1 50); do
            if python3 -c "import socket;socket.create_connection(('127.0.0.1',8084),1)" 2>/dev/null; then break; fi
            sleep 0.2
          done
          set +e
          ./build/examples/megohttp_example_callback_cancel http://127.0.0.1:8084/ 100
          rc=$?
          set -e
          echo "callback_cancel exit code: $rc (2 = cancelled, as intended)"
          test "$rc" -eq 2

      - name: Run the HTTPS custom-CA example against the TLS fixture
        run: |
          set -e
          python3 tests/https_test_server.py tests/tls_fixtures/server-cert.pem \
            tests/tls_fixtures/server-key.pem > https.log 2>&1 &
          for i in $(seq 1 50); do
            grep -q READY https.log && break
            sleep 0.2
          done
          PORT=$(awk '/READY/{print $3}' https.log)
          echo "https fixture port $PORT"
          ./build/examples/megohttp_example_https_custom_ca --port "$PORT"

      - name: Run the multipart examples against the multipart server
        run: |
          set -e
          python3 examples/servers/multipart_server.py 8085 > mp.log 2>&1 &
          for i in $(seq 1 50); do
            if python3 -c "import socket;socket.create_connection(('127.0.0.1',8085),1)" 2>/dev/null; then break; fi
            sleep 0.2
          done
          ./build/examples/megohttp_example_multipart_upload http://127.0.0.1:8085/upload README.md
          ./build/examples/megohttp_example_multipart_response http://127.0.0.1:8085/batch
          ./build/examples/megohttp_example_multipart_continuous http://127.0.0.1:8085/stream

      - name: Run the WebSocket compression and reconnect examples
        run: |
          set -e
          python3 examples/servers/ws_server.py 8087 > ws_def.log 2>&1 &
          python3 examples/servers/ws_server.py 8088 --require-token-prefix "Bearer demo-" \
            --drop-after 1 > ws_auth.log 2>&1 &
          python3 examples/servers/ws_server.py 8089 --vary-negotiation --drop-after 1 \
            > ws_vary.log 2>&1 &
          for i in $(seq 1 100); do
            grep -q READY ws_def.log && grep -q READY ws_auth.log && grep -q READY ws_vary.log && break
            sleep 0.2
          done
          ./build/examples/megohttp_example_ws_deflate_negotiation ws://127.0.0.1:8087/chat
          ./build/examples/megohttp_example_ws_deflate_stream      ws://127.0.0.1:8087/chat
          ./build/examples/megohttp_example_ws_reconnect_auth      ws://127.0.0.1:8088/chat
          ./build/examples/megohttp_example_ws_reconnect_deflate   ws://127.0.0.1:8089/chat

      - name: Run the proxy and cookie examples
        run: |
          set -e
          python3 examples/servers/cookie_server.py 8090 > cookie.log 2>&1 &
          python3 tests/proxy_test_server.py --mode forward > p_fwd.log 2>&1 &
          python3 tests/proxy_test_server.py --mode forward \
            --tls-cert tests/tls_fixtures/server-cert.pem \
            --tls-key tests/tls_fixtures/server-key.pem > p_https_fwd.log 2>&1 &
          python3 tests/proxy_test_server.py --mode connect \
            --tls-cert tests/tls_fixtures/server-cert.pem \
            --tls-key tests/tls_fixtures/server-key.pem > p_https_conn.log 2>&1 &
          python3 tests/https_test_server.py \
            tests/tls_fixtures/intermediate-server-fullchain.pem \
            tests/tls_fixtures/intermediate-server-key.pem > t_int.log 2>&1 &
          python3 examples/servers/ws_server.py 8091 \
            --cert tests/tls_fixtures/server-cert.pem \
            --key tests/tls_fixtures/server-key.pem > ws_wss.log 2>&1 &
          for i in $(seq 1 150); do
            grep -q READY p_fwd.log && grep -q READY p_https_fwd.log && \
              grep -q READY p_https_conn.log && grep -q READY t_int.log && \
              grep -q READY ws_wss.log && break
            sleep 0.2
          done
          P_FWD=$(awk '/READY/{print $3}' p_fwd.log)
          P_HTTPS_FWD=$(awk '/READY/{print $3}' p_https_fwd.log)
          P_HTTPS_CONN=$(awk '/READY/{print $3}' p_https_conn.log)
          T_INT=$(awk '/READY/{print $3}' t_int.log)
          echo "forward=$P_FWD https-forward=$P_HTTPS_FWD https-connect=$P_HTTPS_CONN target=$T_INT"
          ./build/examples/megohttp_example_proxy_cookie \
            --proxy "127.0.0.1:$P_FWD" http://127.0.0.1:8090
          ./build/examples/megohttp_example_https_proxy_to_http \
            --proxy "localhost:$P_HTTPS_FWD" --proxy-ca tests/tls_fixtures/ca.pem \
            http://127.0.0.1:8090/
          ./build/examples/megohttp_example_https_proxy_to_https \
            --proxy "localhost:$P_HTTPS_CONN" --proxy-ca tests/tls_fixtures/ca.pem \
            --target-ca tests/tls_fixtures/intermediate-ca-chain.pem \
            "https://localhost:$T_INT/"
          ./build/examples/megohttp_example_wss_via_https_proxy \
            --proxy "localhost:$P_HTTPS_CONN" --proxy-ca tests/tls_fixtures/ca.pem \
            --target-ca tests/tls_fixtures/ca.pem wss://localhost:8091/chat

  linux-cross:
    name: Linux ${{ matrix.arch }} | asio + tls-none + std | features off | cross-compile only
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            processor: aarch64
            compiler: aarch64-linux-gnu-g++
            package: g++-aarch64-linux-gnu
          - arch: armv7l
            processor: armv7l
            compiler: arm-linux-gnueabihf-g++
            package: g++-arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fmt 12.1.0 headers
        uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: deps/fmt-12.1.0
          fetch-depth: 1

      - name: Checkout Asio 1.38.0 headers
        uses: actions/checkout@v4
        with:
          repository: chriskohlhoff/asio
          ref: asio-1-38-0
          path: deps/asio-asio-1-38-0
          fetch-depth: 1

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.package }}

      - name: Configure and compile smoke target
        run: |
          cmake -S tests/cross_compile -B build-linux-${{ matrix.arch }} -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DMEGOHTTP_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build-linux-${{ matrix.arch }} --verbose
          ls -l build-linux-${{ matrix.arch }}/libmegohttp_cross_smoke.a
